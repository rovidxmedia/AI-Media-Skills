name: Publishing CPU checks
on:
  push:
    paths: ['skills/podcast-packager/**', 'skills/short-form-clips/**', 'tests/test_publishing.py', '.github/workflows/publishing.yml']
  pull_request:
    paths: ['skills/podcast-packager/**', 'skills/short-form-clips/**', 'tests/test_publishing.py', '.github/workflows/publishing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publishing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Exercise publishing and shorts without models
        run: python -m unittest discover -s tests -p "test_publishing.py" -v
