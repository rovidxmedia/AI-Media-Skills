name: Portable pack installation
on:
  push:
    paths: ['scripts/**', 'skills/**', 'examples/**', 'tests/test_install*.py', '.github/workflows/portable-install.yml']
  pull_request:
    paths: ['scripts/**', 'skills/**', 'examples/**', 'tests/test_install*.py', '.github/workflows/portable-install.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test clean copy and fictional-show setup
        run: python -m unittest discover -s tests -p "test_install.py" -v

  installed-media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audio dependencies
        run: python -m pip install -r skills/podcast-audio-repair/requirements.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Exercise installed repair and exports on generated media
        run: python -m unittest discover -s tests -p "test_install_media.py" -v
